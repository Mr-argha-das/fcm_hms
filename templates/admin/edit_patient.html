</div>

<!-- ================= EDIT PATIENT ================= -->
<div class="bg-card p-3 mb-3 border border-gray-50/20 rounded-2xl shadow-soft4">
  <h5 class="mb-3 font-semibold underline flex gap-2">  <i data-lucide="users" class="w-5 h-5"></i>Edit Patient Details</h5>

  <div class="row g-3">
    <!-- USER -->
    <div class="col-md-4">
      <label>Name</label>
      <input id="edit_name" class="form-control" value="{{ patient.user.name }}">
    </div>

    <div class="col-md-4">
      <label>Phone</label>
      <input id="edit_phone" class="form-control" value="{{ patient.user.phone }}">
    </div>

    <div class="col-md-4">
      <label>Father / Husband Name</label>
      <input id="edit_father_name" class="form-control" value="{{ patient.user.father_name or '' }}">
    </div>

    <div class="col-md-4">
      <label>Patient Relative Name</label>
      <input id="edit_relative_name" class="form-control" value="{{ patient.relative_name or '' }}">
    </div>

    <div class="col-md-4">
      <label>Other Number</label>
      <input id="edit_other_number" class="form-control" value="{{ patient.user.other_number or '' }}">
    </div>

    <div class="col-md-4">
      <label>Email</label>
      <input id="edit_email" class="form-control" value="{{ patient.user.email or '' }}">
    </div>

    <!-- PATIENT -->
    <div class="col-md-4">
      <label>Age</label>
      <input id="edit_age" type="number" class="form-control" value="{{ patient.age or '' }}">
    </div>

    <div class="col-md-4">
      <label>Gender</label>
      <select id="edit_gender" class="form-select">
        <option value="">Select</option>
        <option value="Male" {% if patient.gender == "Male" %}selected{% endif %}>Male</option>
        <option value="Female" {% if patient.gender == "Female" %}selected{% endif %}>Female</option>
        <option value="Other" {% if patient.gender == "Other" %}selected{% endif %}>Other</option>
      </select>
    </div>

    <div class="col-md-6">
      <label>Medical History</label>
      <textarea id="edit_medical_history" class="form-control">{{ patient.medical_history }}</textarea>
    </div>

    <div class="col-md-6">
      <label>Address</label>
      <textarea id="edit_address" class="form-control">{{ patient.address }}</textarea>
    </div>

    <div class="col-md-3">
      <label>Service Start</label>
      <input id="edit_service_start" type="date" class="form-control" value="{{ patient.service_start }}">
    </div>

    <div class="col-md-3">
      <label>Service End</label>
      <input id="edit_service_end" type="date" class="form-control" value="{{ patient.service_end }}">
    </div>

  <div class="col-md-3">
    <label>Hospital</label>
    <select id="edit_hospital" class="form-select">
      <option value="">Select</option>

      {% for h in hospitals %}
        <option value="{{ h.id }}"
          {% if patient.user.hospital and patient.user.hospital.id == h.id %}
            selected
          {% endif %}>
          {{ h.name }} ({{ h.branch }})
        </option>
      {% endfor %}
    </select>
  </div>


    <div class="col-md-3">
      <label>Doctor</label>
      <select id="edit_doctor" class="form-select">
        <option value="">Not Assigned</option>
        {% for d in doctors %}
        {% if d and d.user %}
        <option value="{{ d.id }}"
          {% if patient.assigned_doctor and (patient.assigned_doctor.id == d.id or patient.assigned_doctor == d) %}selected{% endif %}>
          {% if not (d.user.name and d.user.name.strip().lower().startswith('dr')) %}Dr. {% endif %}{{ d.user.name or 'Doctor' }}{% if d.specialization %} ({{ d.specialization }}){% endif %}
        </option>
        {% endif %}
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label>City</label>
      <input id="edit_city" class="form-control" value="{{ patient.city or '' }}">
    </div>
    
    <div class="col-md-3">
      <label>State</label>
      <input id="edit_state" class="form-control" value="{{ patient.state or '' }}">
    </div>
    
    <div class="col-md-3">
      <label>Pincode</label>
      <input id="edit_pincode" class="form-control" value="{{ patient.pincode or '' }}">
    </div>
    <div class="col-md-3">
      <label>Aadhaar Number</label>
      <input id="edit_aadhaar_number" class="form-control" inputmode="numeric" maxlength="14" value="{{ patient.aadhaar_number or '' }}">
    </div>
  </div>

  <!-- <div class="col-md-3">
  <label>Aadhar Card</label>
  <input id="edit_adharcard" class="form-control" value="{{ patient.adharcard or '' }}">
</div> -->


<!-- <div class="col-md-6">
  <label>Documents (comma separated URLs)</label>
  <textarea id="edit_documents" class="form-control">{{ patient.documents | join(',') }}</textarea>
</div> -->

  <div class="text- mt-3">
    <button class="- bg-success text-white text-md px-3 py-1.5 hover:scale-105  rounded-xl" onclick="updatePatient()"> Update Patient</button>
  </div>
</div>

<!-- ================= ASSIGN NURSE ================= -->
<!-- ================= ASSIGN NURSE ================= -->
<div class="bg-card mb-3 border border-gray-50/20 rounded-2xl shadow-soft4">
  <div class="card-header font-bold flex gap-2 p-3 bg-light rounded-t-2xl">
    <i data-lucide="stethoscope" class="w-5 h-5 mt-[2px]"></i>
    Assign Nursing / Care Staff
  </div>

  <div class="card-body row g-3 p-3">

    <div class="col-md-3">
      <label>Care Type</label>
      <select id="care_role" class="form-select" onchange="filterStaffByRole()">
        <option value="NURSING">Nursing</option>
        <option value="CARETAKER">Care Taker</option>
        <option value="BABY_CARETAKER">Baby Care Taker</option>
      </select>
    </div>

    <div class="col-md-3">
      <label>Staff</label>
      <select id="nurse" class="form-select" onchange="setStaffContact()">
        {% for n in nurses %}
        <option value="{{ n.id }}" data-contact="{{ n.user.phone }}" data-care-role="{% if n.nurse_type == 'BABY_CARETAKER' %}BABY_CARETAKER{% elif n.nurse_type == 'CARETAKER' %}CARETAKER{% else %}NURSING{% endif %}">
          {{ n.user.name }} — {{ n.nurse_type }} ({{ n.user.phone }})
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-3">
      <label>Staff Contact Number</label>
      <input id="staff_contact_number" class="form-control" readonly placeholder="Select staff">
    </div>

    <div class="col-md-3">
      <select id="duty_type" class="form-select">
        <option value="10HR">10 Hours</option>
        <option value="12HR">12 Hours</option>
        <option value="24HR">24 Hours</option>
        <option value="FLEX">Flexible</option>
      </select>
    </div>

    <div class="col-md-3">
      <select id="shift" class="form-select">
        <option value="DAY">Day</option>
        <option value="NIGHT">Night</option>
        <option value="24_HOURS">24 Hours</option>
      </select>
    </div>

    <!-- Duty Location -->
    <div class="col-md-3">
      <label>Duty Location</label>
      <select id="dutyLocation" class="form-select" onchange="toggleDutyFields()">
        <option value="HOSPITAL">Hospital</option>
        <option value="HOME">Home</option>
      </select>
    </div>

    <!-- HOSPITAL -->
    <div class="col-md-3 hospital-field">
      <label>Ward</label>
      <input id="ward" class="form-control">
    </div>

    <div class="col-md-3 hospital-field">
      <label>Room</label>
      <input id="room" class="form-control">
    </div>

    <!-- HOME -->
    <div class="col-md-6 home-field d-none">
      <label>Home Address</label>
      <textarea id="address" class="form-control"></textarea>
    </div>

    <!-- Duration -->
    <div class="col-md-3">
      <label>Duration (Days)</label>
      <input type="number" id="duration_days" class="form-control" placeholder="e.g. 5">
    </div>

    <!-- Price Per Day -->
    <div class="col-md-3">
      <label>Price Per Day</label>
      <input type="number" step="0.01" id="price_perday" class="form-control" placeholder="e.g. 1200">
    </div>

    <div class="col-md-2 ">
      <button
        class="bg-success mt-4 text-white px-3 py-2 rounded-xl hover:scale-105"
        id="assignBtn">
        Assign
      </button>
    </div>

  </div>
</div>

<!-- ================= JS ================= -->
<script>
  const patientId = "{{ patient.id }}";

  function headers() {
    return {
      "Content-Type": "application/json",
      Authorization: "Bearer " + localStorage.getItem("token"),
    };
  }

async function updatePatient() {
  const payload = {
    name: edit_name.value || null,
    father_name: edit_father_name.value || null,
    phone: edit_phone.value || null,
    relative_name: edit_relative_name.value || null,
    other_number: edit_other_number.value || null,
    email: edit_email.value || null,

    age: edit_age.value || null,
    gender: edit_gender.value || null,
    medical_history: edit_medical_history.value || null,
    address: edit_address.value || null,

    service_start: edit_service_start.value || null,
    service_end: edit_service_end.value || null,

    hospital: edit_hospital.value || null,
    assigned_doctor: edit_doctor.value || null,

    // adharcard: edit_adharcard.value || null,
    city: edit_city.value || null,
    state: edit_state.value || null,
    pincode: edit_pincode.value || null,
    aadhaar_number: edit_aadhaar_number.value || null,

    // documents: edit_documents.value
    //   ? edit_documents.value.split(",").map(d => d.trim())
    //   : null
  };

  const res = await fetch(`/patient/${patientId}/edit`, {
    method: "PUT",
    headers: headers(),
    body: JSON.stringify(payload),
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.detail || "Update failed");
    return;
  }

  alert("✅ Patient updated successfully");
  location.reload();
}
  document.getElementById("assignBtn").addEventListener("click", async () => {

  const dutyLocation = document.getElementById("dutyLocation").value;
  if (!nurse.value || nurse.selectedOptions[0].disabled) {
    alert("No staff is available for the selected care type.");
    return;
  }
  const duration = parseInt(document.getElementById("duration_days").value) || 0;
const pricePerDay = parseFloat(document.getElementById("price_perday").value) || 0;
 const startDate = new Date();
const endDate = new Date();
endDate.setDate(startDate.getDate() + duration);
  const payload = {
  nurse_id: nurse.value,
  care_role: care_role.value,
  staff_contact_number: staff_contact_number.value || null,
  duty_type: duty_type.value,
  shift: shift.value,
  dutyLocation: dutyLocation,

  duration_days: duration,
  price_perday: pricePerDay,

  duty_start: startDate.toISOString(),
  duty_end: endDate.toISOString(),
};
  // 🏥 Hospital
  if (dutyLocation === "HOSPITAL") {
    payload.ward = ward.value || null;
    payload.room_no = room.value || null;
  }

  // 🏠 Home
  if (dutyLocation === "HOME") {
    payload.address = address.value || null;
  }

  const res = await fetch(`/patient/${patientId}/assign-nurse`, {
    method: "POST",
    headers: headers(),
    body: JSON.stringify(payload),
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.detail || "Failed");
    return;
  }

  alert("✅ Nurse assigned successfully");
  location.reload();
});

function toggleDutyFields() {
  const location = document.getElementById("dutyLocation").value;

  document.querySelectorAll(".hospital-field").forEach(el =>
    el.classList.toggle("d-none", location === "HOME")
  );

  document.querySelectorAll(".home-field").forEach(el =>
    el.classList.toggle("d-none", location === "HOSPITAL")
  );
}

function filterStaffByRole() {
  const requestedRole = document.getElementById("care_role").value;
  const staff = document.getElementById("nurse");
  let selectedVisible = false;

  [...staff.options].forEach(option => {
    const matches = option.dataset.careRole === requestedRole;
    option.hidden = !matches;
    option.disabled = !matches;
    if (option.selected && matches) selectedVisible = true;
  });

  if (!selectedVisible) {
    const firstMatch = [...staff.options].find(option => !option.disabled);
    if (firstMatch) firstMatch.selected = true;
  }
  setStaffContact();
}

function setStaffContact() {
  const selected = document.getElementById("nurse").selectedOptions[0];
  document.getElementById("staff_contact_number").value = selected ? selected.dataset.contact || "" : "";
}

document.getElementById("shift").addEventListener("change", () => {
  if (shift.value === "24_HOURS") duty_type.value = "24HR";
});

filterStaffByRole();
  async function updatePassword() {
    const res = await fetch("/auth/update-password", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        phone: "{{ patient.user.phone }}",
        password: password_field.value,
      }),
    });

    if (!res.ok) return alert("Failed");
    alert("Password updated");
  }
</script>

{% endblock %}
