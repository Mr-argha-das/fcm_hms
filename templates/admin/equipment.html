{% extends "admin/base.html" %} {% block title %}Equipment Management{% endblock
%} {% block content %}

<div class="space-y-6">
  <!-- ADD CARD -->
  <div class="bg-card border border-gray-50/20 rounded-2xl shadow-soft4">
    <!-- HEADER -->
    <div class="d-flex p-3 justify-content-between align-items-center">
      <h5 class="mb-0 text-md">Equipment Management</h5>
    </div>
    <div class="row g-3 p-3">
      <div class="col-md-5">
        <input id="title" class="form-control" placeholder="Equipment Title" />
      </div>

      <div class="col-md-3">
        <input
          id="price"
          type="number"
          step="0.01"
          class="form-control"
          placeholder="Price"
        />
      </div>

      <div class="col-md-2">
        <button
          onclick="createEquipment()"
          class="btn btn-success !rounded-lg w-100"
        >
          Add
        </button>
      </div>
    </div>
  </div>

  <!-- ALL EQUIPMENT TABLE -->
  <div class="bg-card border border-gray-50/20 rounded-2xl shadow-soft4">
    <div class="d-flex justify-content-between align-items-center px-3 pt-3">
      <h5 class="mb-4 font-semibold">All Equipment</h5>
      <span class="badge bg-secondary" id="totalEquipBadge">0</span>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead class="table-light">
          <tr>
            <th>Title</th>
            <th>Price</th>
            <th>Status</th>
            <th width="200">Action</th>
          </tr>
        </thead>

        <tbody id="equipmentTable"></tbody>
      </table>
    </div>
  </div>

  <!-- IN USE EQUIPMENT TABLE -->
  <div class="bg-card border border-gray-50/20 rounded-2xl shadow-soft4">
    <div class="d-flex justify-content-between align-items-center px-3 pt-3">
      <h5 class="mb-4 font-semibold">In Use Equipment</h5>
      <span class="badge bg-danger" id="inUseEquipBadge">0</span>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead class="table-light">
          <tr>
            <th>Title</th>
            <th>Price</th>
            <th>Used By</th>
            <th>Assignments</th>
          </tr>
        </thead>

        <tbody id="inUseEquipmentTable"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ================= MODAL ================= -->

<div class="modal fade" id="editModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Edit Equipment</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input id="editTitle" class="form-control mb-3" placeholder="Title" />
        <input id="editPrice" type="number" step="0.01" class="form-control mb-3" placeholder="Price" />
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button onclick="updateEquipment()" class="btn btn-success">
          Save
        </button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const API_BASE = "/equipment"; // ✅ single source of truth

  let editId = null;
  let allEquipment = [];
  const modal = new bootstrap.Modal(document.getElementById("editModal"));

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  /////////////////////////////////////////////////
  // LOAD ALL + RENDER BOTH TABLES
  /////////////////////////////////////////////////
  async function loadEquipment() {
    const res = await fetch(`${API_BASE}/equipment-getall`);
    allEquipment = await res.json();

    renderAllEquipment();
    renderInUseEquipment();
  }

  function renderAllEquipment() {
    const table = document.getElementById("equipmentTable");
    table.innerHTML = "";

    if (!allEquipment.length) {
      table.innerHTML =
        '<tr><td colspan="4" class="text-center text-muted py-3">No equipment added yet.</td></tr>';
      return;
    }

    allEquipment.forEach((e) => {
      const statusBadge = e.in_use
        ? `<span class="badge bg-danger">In Use × ${e.in_use_count}</span>`
        : `<span class="badge bg-success">Available</span>`;

      table.innerHTML += `
        <tr>
          <td class="fw-semibold">${escapeHtml(e.title)}</td>
          <td>₹ ${e.price ?? 0}</td>
          <td>${statusBadge}</td>
          <td>
            <button class="btn btn-sm btn-warning me-2" onclick="openEdit('${e.id}')">
              Edit
            </button>

            <button class="btn btn-sm btn-danger" onclick="deleteEquipment('${e.id}')">
              Delete
            </button>
          </td>
        </tr>
      `;
    });
  }

  function renderInUseEquipment() {
    const inUse = allEquipment.filter((e) => e.in_use);
    const table = document.getElementById("inUseEquipmentTable");
    document.getElementById("inUseEquipBadge").textContent = inUse.length;
    document.getElementById("totalEquipBadge").textContent = allEquipment.length;

    table.innerHTML = "";

    if (!inUse.length) {
      table.innerHTML =
        '<tr><td colspan="4" class="text-center text-muted py-3">No equipment is currently in use.</td></tr>';
      return;
    }

    inUse.forEach((e) => {
      const usedBy =
        (e.used_by && e.used_by.length ? e.used_by : ["Unknown"])
          .map(escapeHtml)
          .join(", ");

      table.innerHTML += `
        <tr>
          <td class="fw-semibold">${escapeHtml(e.title)}</td>
          <td>₹ ${e.price ?? 0}</td>
          <td>${usedBy}</td>
          <td><span class="badge bg-danger">${e.in_use_count}</span></td>
        </tr>
      `;
    });
  }

  /////////////////////////////////////////////////
  // CREATE
  /////////////////////////////////////////////////
  async function createEquipment() {
    const title = document.getElementById("title").value;
    const price = document.getElementById("price").value;

    if (!title) {
      alert("Enter title");
      return;
    }

    if (!price) {
      alert("Enter price");
      return;
    }

    await fetch(`${API_BASE}/create-equipment`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title,
        price: parseFloat(price),
      }),
    });

    document.getElementById("title").value = "";
    document.getElementById("price").value = "";

    loadEquipment();
  }
  /////////////////////////////////////////////////
  // DELETE
  /////////////////////////////////////////////////
  async function deleteEquipment(id) {
    if (!confirm("Delete this equipment?")) return;

    await fetch(`${API_BASE}/equipment-delete/${id}`, {
      method: "DELETE",
    });

    loadEquipment();
  }

  /////////////////////////////////////////////////
  // EDIT
  /////////////////////////////////////////////////
  function openEdit(id) {
    const equipment = allEquipment.find((e) => e.id === id);
    if (!equipment) return;

    editId = id;
    document.getElementById("editTitle").value = equipment.title;
    document.getElementById("editPrice").value = equipment.price ?? 0;

    modal.show();
  }

  /////////////////////////////////////////////////
  // UPDATE
  /////////////////////////////////////////////////
  async function updateEquipment() {
    const title = document.getElementById("editTitle").value;

    await fetch(`${API_BASE}/equipment-update/${editId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title,
        price: parseFloat(document.getElementById("editPrice").value),
      }),
    });

    modal.hide();
    loadEquipment();
  }

  loadEquipment();
</script>

{% endblock %}
