{% extends "admin/base.html" %} {% block title %}Equipment Management{% endblock
%} {% block content %}

<div class="space-y-6">
  <!-- ADD CARD -->
  <div class="bg-card border border-gray-50/20 rounded-2xl shadow-soft4">
    <!-- HEADER -->
    <div class="d-flex p-3 justify-content-between align-items-center">
      <div>
        <h5 class="mb-0 text-md font-semibold text-gray-800">Equipment Catalog</h5>
        <p class="text-xs text-muted mb-0">Add and manage medical equipment available in inventory</p>
      </div>
      <div class="d-flex gap-2">
        <a
          href="/admin/request-equipment"
          class="bg-purple-600 text-white px-3 py-1.5 !rounded-xl hover:bg-purple-700 transition text-sm font-medium"
        >
          <i data-lucide="clipboard-list" class="w-4 h-4 inline me-1"></i> Equipment in Use
        </a>
      </div>
    </div>
    <div class="row g-3 p-3">
      <div class="col-md-5">
        <input id="title" class="form-control" placeholder="Equipment Title (e.g. Oxygen Concentrator)" />
      </div>

      <div class="col-md-3">
        <input 
          id="price" 
          type="number" 
          step="0.01"
          class="form-control" 
          placeholder="Daily Rate (₹)"
        />
      </div>

      <div class="col-md-2">
        <button
          onclick="createEquipment()"
          class="btn btn-success !rounded-lg w-100"
        >
          <i data-lucide="plus" class="w-4 h-4 inline me-1"></i> Add
        </button>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="bg-card border border-gray-50/20 rounded-2xl shadow-soft4">
    <h5 class="mb-4 font-semibold px-3 pt-3">All Equipment</h5>

    <div class="table-responsive">
      <table class="table align-middle table-hover">
        <thead class="table-light">
          <tr>
            <th>Title</th>
            <th>Daily Rate</th>
            <th width="200">Action</th>
          </tr>
        </thead>

        <tbody id="equipmentTable">
          <tr>
            <td colspan="3" class="text-center py-3 text-muted">Loading equipment...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ================= MODAL ================= -->

<div class="modal fade" id="editModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title font-semibold">Edit Equipment</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label text-sm text-muted">Title</label>
          <input id="editTitle" class="form-control" placeholder="Title" />
        </div>
        <div class="mb-3">
          <label class="form-label text-sm text-muted">Price Per Day (₹)</label>
          <input id="editPrice" type="number" step="0.01" class="form-control" placeholder="Price" />
        </div>
        <div class="mb-3">
          <label class="form-label text-sm text-muted">Image (Optional)</label>
          <input id="editImageFile" type="file" accept="image/*" class="form-control" />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button onclick="updateEquipment()" class="btn btn-success">
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "/equipment"; // ✅ single source of truth

  let editId = null;
  let modal = null;

  document.addEventListener("DOMContentLoaded", function() {
    modal = new bootstrap.Modal(document.getElementById("editModal"));
  });

  /////////////////////////////////////////////////
  // LOAD ALL
  /////////////////////////////////////////////////
  async function loadEquipment() {
    try {
      const res = await fetch(`${API_BASE}/equipment-getall`);
      const data = await res.json();

      const table = document.getElementById("equipmentTable");
      table.innerHTML = "";

      if (!Array.isArray(data) || data.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="3" class="text-center py-4 text-muted">
              No equipment found in catalog. Add one above!
            </td>
          </tr>
        `;
        return;
      }

      data.forEach((e) => {
        table.innerHTML += `
          <tr>
            <td class="fw-semibold">
              <div class="d-flex align-items-center gap-2">
                <div class="rounded bg-light border d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                  <i data-lucide="wrench" class="w-4 h-4 text-gray-500"></i>
                </div>
                <span>${escapeHtml(e.title)}</span>
              </div>
            </td>
            <td>₹ ${e.price ?? 0}</td>

            <td>
              <button class="btn btn-sm btn-outline-warning me-2"
                onclick="openEdit('${e.id}','${escapeHtml(e.title)}','${e.price}','${e.image || ''}')">
                Edit
              </button>

              <button class="btn btn-sm btn-outline-danger"
                onclick="deleteEquipment('${e.id}')">
                Delete
              </button>
            </td>
          </tr>
        `;
      });

      if (window.lucide) lucide.createIcons();
    } catch (err) {
      console.error("Failed to load equipment:", err);
    }
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /////////////////////////////////////////////////
  // CREATE
  /////////////////////////////////////////////////
  async function createEquipment() {
    const title = document.getElementById("title").value.trim();
    const price = document.getElementById("price").value;

    if (!title) {
      alert("Enter equipment title");
      return;
    }

    if (!price) {
      alert("Enter price per day");
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/create-equipment`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title,
          price: parseFloat(price),
        }),
      });

      if (res.ok) {
        document.getElementById("title").value = "";
        document.getElementById("price").value = "";
        loadEquipment();
      } else {
        const err = await res.json();
        alert(err.detail || "Failed to create equipment");
      }
    } catch (e) {
      alert("Error: " + e);
    }
  }

  /////////////////////////////////////////////////
  // DELETE
  /////////////////////////////////////////////////
  async function deleteEquipment(id) {
    if (!confirm("Delete this equipment? This will also remove associated assignments.")) return;

    try {
      await fetch(`${API_BASE}/equipment-delete/${id}`, {
        method: "DELETE",
      });
      loadEquipment();
    } catch (e) {
      alert("Error: " + e);
    }
  }

  /////////////////////////////////////////////////
  // EDIT
  function openEdit(id, title, price, image) {
    editId = id;

    document.getElementById("editTitle").value = title;
    document.getElementById("editPrice").value = price ?? 0;

    const fileInput = document.getElementById("editImageFile");
    if (fileInput) fileInput.value = "";

    if (!modal) {
      modal = new bootstrap.Modal(document.getElementById("editModal"));
    }
    modal.show();
  }

  /////////////////////////////////////////////////
  // UPDATE
  /////////////////////////////////////////////////
  async function updateEquipment() {
    const title = document.getElementById("editTitle").value.trim();
    const priceVal = document.getElementById("editPrice").value;
    const fileInput = document.getElementById("editImageFile");

    if (!title) {
      alert("Title is required");
      return;
    }

    let imagePath = null;

    if (fileInput && fileInput.files && fileInput.files.length) {
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("folder", "equipment");

      try {
        const uploadRes = await fetch("/upload/file", {
          method: "POST",
          body: formData,
        });

        const uploadData = await uploadRes.json();
        if (uploadData.success) {
          imagePath = uploadData.path;
        }
      } catch (e) {
        console.error("Upload error:", e);
      }
    }

    const payload = {
      title,
      price: parseFloat(priceVal) || 0,
    };
    if (imagePath) {
      payload.image = imagePath;
    }

    try {
      await fetch(`${API_BASE}/equipment-update/${editId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (fileInput) fileInput.value = "";
      if (modal) modal.hide();
      loadEquipment();
    } catch (e) {
      alert("Update error: " + e);
    }
  }

  loadEquipment();
</script>

{% endblock %}
