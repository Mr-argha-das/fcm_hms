 function searchRequests() {
  const keyword = (document.getElementById("searchInput").value || "").toLowerCase().trim();

  const filtered = requestsData.filter((r) =>
    String(r.patient_name || "").toLowerCase().includes(keyword) ||
    String(r.patient_phone || r.equipment_phone || "").toLowerCase().includes(keyword) ||
    String(r.equipment_title || "").toLowerCase().includes(keyword)
  );

  renderTable(filtered);
}

async function loadRequests() {
  try {
    const res = await fetch(`${API_BASE}/request-equipment/all`);
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || "Failed to load equipment requests");
    }

    requestsData = Array.isArray(data) ? data : [];
    renderTable(requestsData);
  } catch (error) {
    console.error("Equipment requests error:", error);
    requestsData = [];
    document.getElementById("requestTable").innerHTML = `
      <tr>
        <td colspan="9" class="text-center text-danger py-4">
          Failed to load equipment requests
        </td>
      </tr>
    `;
  }
}

function formatRequestDate(value) {
  if (!value) return "-";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "-" : date.toLocaleDateString();
}

function renderTable(data) {
  const table = document.getElementById("requestTable");
  table.innerHTML = "";

  if (!data.length) {
    table.innerHTML = `
      <tr>
        <td colspan="9" class="text-center text-muted py-4">
          No requests found
        </td>
      </tr>
    `;
    return;
  }

  data.forEach((r) => {
    const phone = r.patient_phone || r.equipment_phone || "-";
    const dailyPrice = Number(r.price_per_day || 0);
    const monthlyPrice = Number(r.monthly_price || 0);
    const monthCount = Number(r.month_count || 1);

    const statusBadge = r.status
      ? `<span class="badge bg-success">Approved</span>`
      : `<span class="badge bg-warning text-dark">Pending</span>`;

    const approveBtn = r.status
      ? `<button class="btn btn-sm btn-secondary" disabled>Approved</button>`
      : `<button class="btn btn-sm btn-success"
            onclick="approveRequest('${r.id}')">
            Approve
         </button>`;

    const actionBtn = `${approveBtn}
      <button class="btn btn-sm btn-outline-danger ms-1"
        onclick="deleteRequest('${r.id}')">Delete</button>`;

    table.innerHTML += `
      <tr>
        <td>${formatRequestDate(r.request_time)}</td>
        <td>${r.patient_name || "-"}</td>
        <td>${r.equipment_title || "-"}</td>
        <td>${phone}</td>
        <td>₹${dailyPrice.toFixed(2)}</td>
        <td>₹${monthlyPrice.toFixed(2)} x ${monthCount}</td>
        <td>${r.ward || "-"}</td>
        <td>${statusBadge}</td>
        <td>${actionBtn}</td>
      </tr>
    `;
  });
}
  //////////////////////////////////////////////////////
  // APPROVE REQUEST
  //////////////////////////////////////////////////////
async function approveRequest(id) {
    if (!confirm("Approve this request?")) return;

    await fetch(`${API_BASE}/request-equipment/approve/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: true }),
    });

    loadRequests(); // refresh
}

async function deleteRequest(id) {
  if (!confirm("Delete this equipment request?")) return;

  const res = await fetch(`${API_BASE}/request-equipment/delete/${id}`, {
    method: "DELETE",
  });
  const data = await res.json();
  if (res.ok) {
    loadRequests();
  } else {
    alert(data.detail || "Failed to delete equipment request");
  }
}
